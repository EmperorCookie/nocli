name: Create Release

on:
  push:
    branches:
    - main

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publishing (OIDC) token exchange

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Analyzes the commits once; the jobs below follow this plan instead of analyzing them again.
    - name: Plan Release
      uses: ./.github/semantic-release-runner
      id: plan
      with:
        dry-run: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      published: ${{ steps.plan.outputs.published }}
      new-version: ${{ steps.plan.outputs.version }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    environment: main
    needs:
    - plan
    if: needs.plan.outputs.published == 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Generate Token
      id: token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ vars.COOKIE_BOT_APP_ID }}
        private-key: ${{ secrets.COOKIE_BOT_PRIVATE_KEY }}

    - name: Create Release
      uses: ./.github/semantic-release-runner
      with:
        plan: ${{ needs.plan.outputs.plan }}
      env:
        GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        GH_TOKEN: ${{ steps.token.outputs.token }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

  publish-pypi:
    name: Publish PyPI
    runs-on: ubuntu-latest
    environment: main
    needs:
    - plan
    - create-release
    if: needs.plan.outputs.published == 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build
      run: |
        python -m pip install --upgrade pip
        python -m pip install hatch build
        hatch version ${{ needs.plan.outputs.new-version }}
        # Build sdist and wheel separately: with plain `python -m build` the
        # wheel is rebuilt from the sdist, where the flat package layout no
        # longer matches `packages = ["src/nocli"]` and hatchling ships an
        # empty wheel (verified with hatchling 1.32.4).
        python -m build -s
        python -m build -w

    # No password: with id-token: write, the action exchanges a GitHub OIDC
    # token for a short-lived PyPI token (Trusted Publishing).
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  cleanup-release:
    name: Cleanup Release
    runs-on: ubuntu-latest
    environment: main
    needs:
    - plan
    - create-release
    - publish-pypi
    if: needs.create-release.result == 'success' && needs.publish-pypi.result == 'failure'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Generate Token
      id: token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ vars.COOKIE_BOT_APP_ID }}
        private-key: ${{ secrets.COOKIE_BOT_PRIVATE_KEY }}

    - name: Delete Release and Tag
      env:
        GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: |
        gh release delete v${{ needs.plan.outputs.new-version }} --yes --cleanup-tag

    - name: Revert Release Commit
      env:
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        git remote set-url origin https://x-access-token:${{ steps.token.outputs.token }}@github.com/${{ github.repository }}
        git revert HEAD --no-edit
        git push origin main
