name: Patch Notes Preview

on:
  pull_request:
    branches:
    - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  patch-notes-preview:
    name: Patch Notes Preview
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # semantic-release only analyzes a checked out branch that exists on the remote, so the merge
    # commit that the checkout leaves detached is put on a local branch named after the PR's branch.
    - name: Branch
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: git switch -c "$HEAD_REF"

    # Only the plan stage is needed: the same runner as the release workflow, in dry run, so that
    # the repository's .releaserc (including the patch-notes plugin) decides what the notes look
    # like. The branch name goes in as a JSON string literal, never as text. The README of the
    # runner explains why `ci` and `unset-gha-env` are needed for a pull request.
    - name: Patch Notes
      id: patch-notes
      uses: ./.github/semantic-release-runner
      with:
        dry-run: true
        ci: false
        unset-gha-env: true
        branches: ${{ format('["main", {0}]', toJSON(github.head_ref)) }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The notes come from commit messages, so they reach the script through the environment and
    # are never interpolated into the script text.
    - name: Comment On PR
      uses: actions/github-script@v9
      env:
        NOTES: ${{ steps.patch-notes.outputs.notes }}
      with:
        script: |
          const marker = "Patch notes for this PR";
          const notes = process.env.NOTES || "No release would be created from this PR.";
          const body = `${marker}:\n\n${notes}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
          });
          const existing = comments.find(
            (comment) =>
              comment.user.login === "github-actions[bot]" && comment.body.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
